# Embedding model registry (extendable).
#
# Every row declares a model_id, runtime (nim | hf), its native
# embedding_dim (when known ahead of time), whether it supports the
# pipeline-wide full_text_context (32k), and human-readable notes.
#
# The embedder (packages/embedder/embedder.py) reads this file,
# finds the row matching cfg.embedder.model_id, and instantiates the
# correct backend. If `supports_32k: false`, the embedder uses
# `cfg.embedder.chunking` to aggregate across multiple windows.
#
# Adding a model: append a new entry below. The pipeline will route to
# the declared runtime automatically; no code change required.

models:
  # ---- Default: NVIDIA Nemotron-flavored embedding, 8k native window ----
  - model_id: nvidia/llama-nemotron-embed-1b-v2
    runtime: nim
    embedding_dim: 2048         # observed from NIM response; not 1024
    supports_32k: false
    native_max_seq: 8192
    notes: Default. 1B parameters, 8k context; chunking:sliding needed for 32k docs.

  # ---- NVIDIA alternatives ----
  - model_id: nvidia/llama-3.2-nv-embedqa-1b-v2
    runtime: nim
    embedding_dim: 1024
    supports_32k: false
    native_max_seq: 512
    notes: Previous ViLA default (retrieval-focused, short window).

  - model_id: nvidia/llama-embed-nemotron-8b
    runtime: nim
    embedding_dim: 4096
    supports_32k: false
    native_max_seq: 8192
    notes: hfdata reference; larger 8B parameters, 4096-dim output.

  # ---- NVIDIA Nemotron-3-Embed (local HuggingFace, sentence-transformers) ----
  # ministral3 backbone; sentence-transformers pooling is mean-token
  # (pooling_mode_mean_tokens: true), which is exactly what
  # HuggingFaceEmbedder already does -- so the local ``runtime: hf`` path
  # is faithful to the model card with no code change. 32k native window
  # (no chunking needed for full_text_context). The model card uses
  # ``query: `` / ``passage: `` instruction prefixes; see the embedder
  # notes for the optional prompt-prefix knob. Runs locally on one GPU
  # with NO NIM endpoint / NVIDIA_API_KEY. Model *weights* are pulled once
  # from HF -- the "no HF cache" rule in this project applies to the legal
  # *datasets*, not to model weights.
  - model_id: nvidia/Nemotron-3-Embed-1B-BF16
    runtime: hf
    embedding_dim: 2048
    supports_32k: true
    native_max_seq: 32768
    notes: NVIDIA Nemotron-3 embedding, 1B params, 2048-d, mean pooling, 32k native. Local HF runtime; ~2GB bf16.

  - model_id: nvidia/Nemotron-3-Embed-8B-BF16
    runtime: hf
    embedding_dim: 4096
    supports_32k: true
    native_max_seq: 32768
    notes: NVIDIA Nemotron-3 embedding, 8B params, 4096-d, mean pooling, 32k native. Local HF runtime; ~16GB bf16, needs GPU.

  # ---- Multilingual sentence-transformers (HuggingFace) ----
  # Lightweight bilingual VI<->EN choice for the tnpl deep-analysis
  # stage. Same model embeds both languages so a per-row VI<->EN cosine
  # is meaningful (translation fidelity proxy).
  - model_id: sentence-transformers/paraphrase-multilingual-mpnet-base-v2
    runtime: hf
    embedding_dim: 768
    supports_32k: false
    native_max_seq: 128
    notes: Multilingual MPNet (50+ langs incl. VI); 768-d; 128-token context. Default for tnpl bilingual analysis.

  # ---- Microsoft Harrier-OSS family (HuggingFace) ----
  - model_id: microsoft/harrier-oss-v1-270m
    runtime: hf
    embedding_dim: null          # autodetect
    supports_32k: true
    native_max_seq: 32768
    notes: Minimal footprint; handles full_text_context without chunking.

  - model_id: microsoft/harrier-oss-v1-0.6b
    runtime: hf
    embedding_dim: null
    supports_32k: true
    native_max_seq: 32768
    notes: Lightweight default for HF runtime; 32k native.

  - model_id: microsoft/harrier-oss-v1-27b
    runtime: hf
    embedding_dim: null
    supports_32k: true
    native_max_seq: 32768
    notes: Highest quality in the harrier-oss family; requires GPU.
