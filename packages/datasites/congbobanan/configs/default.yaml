# Default config for the congbobanan pipeline.
#
# OmegaConf-based; use `_base: default.yaml` from a sibling file to
# override any subset. Hydra-style dotlist overrides accepted on the
# CLI via `--override path.to.key=value`.
#
# congbobanan.toaan.gov.vn is an integer-ID portal: every published
# judgment is addressed as /2taNt1cvn/chi-tiet-ban-an and the URL
# generator enumerates [start_id .. end_id] without hitting the
# network. Real crawls override start_id / end_id on the CLI.

host: congbobanan.toaan.gov.vn
output_dir: ./data
full_text_context: 32768
# Smoke-test default: crawl a tiny slice. Real runs override this on
# the CLI (`--override scraper.start_id=1 scraper.end_id=2100400`).
limit: null

scraper:
  num_workers: 4
  qps: 1.0                  # the WAF is strict; keep polite
  user_agent: "ViLA-research/0.1 (+https://example.vn/contact)"
  proxy: null               # congbobanan refuses non-VN IPs; set a VN proxy
  timeout_s: 30.0
  max_retries: 5
  # WARNING: disables TLS verification for ALL congbobanan traffic.
  # The .gov.vn certificate chain is not in the Mozilla bundle, so the
  # supported path is shipping a custom CA bundle via REQUESTS_CA_BUNDLE
  # and overriding this to ``true``. The default stays ``false`` only
  # because that's what current operators rely on -- review per
  # deployment.
  verify_tls: false
  download_max_retries: 50
  download_retry_delay_s: 30.0
  # Separate, longer-budget retry channel for DNS resolution failures
  # (EAI_AGAIN, EAI_NONAME). systemd-resolved on the worker host can
  # stall for tens of seconds under concurrent load against .gov.vn
  # nameservers; the request/download retry budgets above are tuned
  # for 5xx / connection resets and would give up too early.
  dns_max_retries: 12
  dns_retry_delay_s: 5.0

  # URL templates
  detail_url_template: "https://congbobanan.toaan.gov.vn/2ta{case_id}t1cvn/chi-tiet-ban-an"
  pdf_url_template: "https://congbobanan.toaan.gov.vn/3ta{case_id}t1cvn/"

  # Integer-ID range crawler
  start_id: 1
  end_id: 100               # bump to ~2_100_400 for the full corpus
  retry_empty_detail: true  # re-fetch once if the first detail GET is a ghost

  extra_headers:
    Accept: "*/*"
    Accept-Language: "vi-VN,vi;q=0.9,en;q=0.8"

parser:
  # Cloud NIM chat model (OpenAI-compatible). ``nvidia/nemotron-parse``
  # is the canonical NIM endpoint slug per NVIDIA's NIM OpenAPI spec;
  # it auto-routes to the latest deployed revision (currently v1.2,
  # HF: nvidia/NVIDIA-Nemotron-Parse-v1.2, released 2026-02).
  model_id: nvidia/nemotron-parse
  # hybrid: pypdf first, nemotron-parse v1.2 fallback on either
  # (a) image-only scans (gated by min_local_chars) or
  # (b) catastrophic font corruption (gated by max_local_lossy_score).
  # Requires NVIDIA_API_KEY. Switch to `local` if you only have
  # pypdf, or `nim` to force every PDF through nemotron-parse.
  runtime: hybrid
  min_local_chars: 50
  # Second hybrid fallback gate. ``lossy_score`` (in packages/parser/
  # hybrid.py) measures the fraction of lowercase 1-2-char ASCII
  # fragments embedded in body text -- the signature of catastrophic
  # font corruption where most glyphs render as space (legacy
  # VnTime / VNI / corrupted ToUnicode CMaps). 0.05 cleanly separates
  # the healthy tail (~94% of congbobanan, p50=0.016) from the
  # catastrophic band (~6%, p95+=0.088).
  #
  # NOT the same as the cmap_healer in packages/parser/pypdf.py:
  # * cmap_healer fixes ``<CID> <0020>`` defects in OTHERWISE-healthy
  #   ToUnicode CMaps (~3.4% of corpus); pypdf still extracts good
  #   text, lossy_score stays low.
  # * max_local_lossy_score fires when the CMap is missing entirely
  #   (legacy non-Unicode fonts); pypdf returns mostly-empty
  #   1-2-char fragments, lossy_score climbs above the threshold,
  #   and NIM OCR takes over.
  max_local_lossy_score: 0.05
  num_workers: 4
  nim_base_url: "${oc.env:NIM_BASE_URL,https://integrate.api.nvidia.com/v1}"
  nim_tool: markdown_bbox         # markdown_bbox | markdown_no_bbox | detection_only
  # Source-side raster DPI. The NemotronParseClient renders at this
  # DPI, then thumbnails each page onto a fixed 1536x2048 white
  # canvas matching v1.2's training geometry. 300 DPI gives crisp
  # tone-mark glyph edges before the downscale step.
  nim_dpi: 300
  # Per-page generation cap on the v1.2 layout-JSON output. 3500
  # matches the v1.1 cookbook default; bump to 5000-6000 if you see
  # multi-page tables being truncated mid-row.
  nim_max_tokens: 3500
  # Deterministic decoding. v1.2 is a structured-extraction task;
  # leave at 0.0 unless you're A/B-testing sampling.
  nim_temperature: 0.0
  # Rate-limit retry budget (OpenAI SDK exponential backoff:
  # 1s, 2s, 4s, 8s, 16s). 5 covers ~31s of build.nvidia.com 429
  # windows before the per-page handler logs ``RATE_LIMIT`` and
  # moves on. Bump to 8-10 if you see frequent RATE_LIMIT lines
  # in the parse log; drop to 2 only if rate limits aren't a
  # concern (e.g. local NIM deployment).
  nim_max_retries: 5
  timeout_s: 120.0
  # Declarative parser-side normalizer chain. Runs immediately after
  # PdfParseStage on the in-memory ``markdown`` column, BEFORE the
  # markdown is written to disk -- so ``data/<host>/md/*.md`` is
  # already canonical and downstream consumers (extractor, embedder,
  # ad-hoc readers) see the cleaned text without re-running this work.
  #
  # Order matters (see wiki/PARSING.md § 5.3):
  #   1. ``letter_spaced_collapse`` -- universal 2+-space glyph-run
  #      collapser ("T h \u00f4 n g  t i n" -> "Th\u00f4ng tin").
  #   2. ``congbobanan_join_word_breaks`` -- site-specific
  #      single-space mid-word rejoiner ("hu y\u1ec7n" -> "huy\u1ec7n");
  #      runs BEFORE vietnamese_text so the syllable predicate sees
  #      original NFC tone marks.
  #   3. ``vietnamese_text`` -- ftfy + NFC + tone-mark + whitespace.
  #   4. ``congbobanan_join_soft_wraps`` -- site-specific PDF
  #      soft-wrap reflow (folds 4 visual lines back into 1 logical
  #      paragraph); runs AFTER vietnamese_text so its terminal-
  #      punctuation checks see canonical NFC quotes.
  #   5. ``congbobanan_strip_page_noise`` -- site-specific per-page
  #      bare-digit body-line stripper; runs LAST.
  #
  # Reuses the same registry-backed chain stage the extractor uses,
  # so each name resolves via packages.extractor.normalizers.NORMALIZER_REGISTRY.
  # An empty list explicitly disables parser-side normalisation.
  #
  # ``llm_ocr_fix`` runs LAST: it sees the most-cleaned text (after the
  # five deterministic stages) and only fires its NIM call when the
  # regex layer leaves residual Vietnamese OCR slips. Each call hits
  # the paid build.nvidia.com tier (~3-5s + ~1k tokens per doc); cost
  # is bounded by SkipExistingMarkdownFilter -- only docs WITHOUT a
  # cached .md (the 162k v1.2-fallback cohort plus future crawls)
  # actually traverse the parse chain. Edit shape is enforced by
  # token-count + proper-noun + len + digit guardrails (see
  # packages/extractor/llm_ocr_fix.py); hallucinated word-insertion
  # corrections are rejected automatically.
  normalizers:
    - letter_spaced_collapse
    - congbobanan_join_word_breaks
    - vietnamese_text
    - congbobanan_join_soft_wraps
    - congbobanan_strip_page_noise
    - llm_ocr_fix

extractor:
  # Declarative normalizer chain (wiki/DATASITES.md §3.5). congbobanan ships
  # only the universal Vietnamese-text baseline -- the corpus is
  # high-quality court-published judgments without the
  # CMS-export artefacts vbpl has, so no site-specific
  # normalizers are needed.
  #
  # ``run_text_normalization: false`` because the chain already owns
  # normalization; leaving the inline ``normalize_text`` on would
  # double-normalize ``markdown`` (idempotent but wasteful).
  #
  # OPT-IN: ``llm_ocr_fix`` (NIM-hosted Qwen3.5-122B-A10B) catches
  # OCR-typo slips that v1.2 leaves behind ("phien toa" -> "phien
  # toa", "chi toa" -> "chu toa", "Vien kiem sat" -> "Vien kiem
  # sat", missing tone marks, etc). Each call hits the paid
  # build.nvidia.com tier and adds ~3-5s per doc; only enable for
  # bulk passes you actually want to LLM-clean. Append it AFTER
  # ``vietnamese_text`` so the deterministic layer fixes the easy
  # cases first; the LLM only sees what regex couldn't resolve.
  # Edit shape is enforced by guardrails (token count, proper-noun
  # protection, len cap, no-digit, per-doc caps) -- see
  # packages/extractor/llm_ocr_fix.py for the rules.
  #
  #   normalizers:
  #     - vietnamese_text
  #     - llm_ocr_fix
  normalizers:
    - vietnamese_text
  run_text_normalization: false
  run_generic_layer: true
  run_site_layer: false          # precedent normalization is anle-only
  run_structure_layer: true      # hierarchical doc model (sections / paragraphs / sentences)
  llm_tier_for_ambiguous: fast
  max_seq_length: "${..full_text_context}"

# Parquet consumption tier shard sizing -- congbobanan uses the
# wiki/DATASITES.md §3.5 default (10K rows / shard); judgment rows are thin
# (markdown + structure stats, no inline structure_json), so the
# default packs to ~80-120 MB per shard well under the HF dataset-
# viewer cap.

embedder:
  model_id: nvidia/llama-nemotron-embed-1b-v2
  runtime: nim
  batch_size: 8
  max_seq_length: 8192
  chunking: sliding
  chunk_overlap: 256
  model_dtype: bfloat16
  device: auto

reducer:
  methods: [pca, tsne, umap]
  n_components: 2
  prefer_gpu: true

executor:
  name: xenna
  mode: streaming
  logging_interval: 60
  autoscale_interval_s: 180
  cpu_allocation_percentage: 0.9
  ignore_failures: false

ray:
  address: null             # set to "ray://head:10001" for a remote cluster
  runtime_env: {}
  num_cpus: null
  num_gpus: null

stage_overrides:
  parse_files_per_partition: 32
  extract_files_per_partition: 32
  embed_files_per_partition: 16
  # Reducer fits per partition; keep the whole corpus in ONE partition
  # so PCA/UMAP coordinates and cluster_ids stay globally comparable.
  reduce_files_per_partition: 100000
