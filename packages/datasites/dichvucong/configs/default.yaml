# Default config for dichvucong (national portal /api/v1, Playwright).
#
# The 2025+ SPA serves full structured procedure detail through public
# /api/v1 endpoints behind an F5/TSPD WAF. We drive a headless browser
# (challenge solved once, then in-page fetch) — no Ray, no auth.

host: dichvucong.gov.vn
output_dir: ./data
full_text_context: 32768

scraper:
  base_url: "https://dichvucong.gov.vn"
  formality_target_type: "VIETNAMESE_CITIZEN"
  # Union across audiences to maximise distinct-procedure coverage. The list
  # is the same endpoint; each audience surfaces a partly-different set.
  formality_target_types:
    - VIETNAMESE_CITIZEN
    - FOREIGNER
    - OVERSEAS_VIETNAMESE
    - ENTERPRISE
    - ORGANIZATION
    - BUSINESS
    - OTHER
  record_per_page: 100          # list page size (lastId cursor)
  max_pages: 100000             # safety cap; stops when lastId stalls
  headless: true
  browser: chromium
  nav_timeout_s: 60.0
  qps: 4.0                      # in-page fetch rate (polite)
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0 Safari/537.36"
  timeout_s: 60.0

embedder:
  model_id: nvidia/llama-nemotron-embed-1b-v2
  runtime: nim
  text_field: content_text
  chunking: sentence
  chunk_overlap: 128

reducer:
  methods: [pca, umap, tsne]
  n_components: 2
  prefer_gpu: true
  cluster: false
