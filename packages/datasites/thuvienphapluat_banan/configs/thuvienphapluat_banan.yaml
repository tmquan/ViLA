# scraper:
#   qps: 1.0                  # gentler on a flaky VPN
#   num_workers: 2
#   max_pages: 100            # smoke run: only walk the first 100 listing pages
#
# extractor:
#   normalizers:
#     - vietnamese_text
#     - banan_strip_html_junk    # add a site-specific normaliser
