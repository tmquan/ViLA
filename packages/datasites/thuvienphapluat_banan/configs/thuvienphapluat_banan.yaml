# thuvienphapluat_banan-specific overrides on top of default.yaml.
#
# default.yaml already encodes every knob the crawler consumes. This
# file exists so `--config-name thuvienphapluat_banan` auto-resolves
# to a site-named config (parity with anle / pbgdpl / phapdien /
# vbpl) — operators who want to flip a knob without dotlist overrides
# add it here.

_base: default.yaml

# Example operator-tunable overrides (uncomment as needed):
