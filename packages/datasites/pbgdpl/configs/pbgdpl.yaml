_base: default.yaml

# pbgdpl.gov.vn (Cổng thông tin điện tử Phổ biến giáo dục pháp luật)
#
# Q&A surface: /Pages/hoi-dap-pl.aspx -> AJAX user control at
# /SMPT_Publishing_UC/HoiDapPL/frmDSCauHoi.aspx (HTML fragments).
#
# Polite envelope: 2 QPS / 4 workers gives a full-corpus run in
# ~50 minutes (1 index + 575 list pages + ~1 100 lv pages + ~4 600
# detail pages = ~6 300 requests, with token-bucket pacing).
# Increase scraper.qps cautiously: the host has a soft per-IP limit
# and returns intermittent 429s above ~5 QPS in our probes.

scraper:
  num_workers: 4
  qps: 2.0
  walk_lv: true

  # The homepage at /Pages/hoi-dap-pl.aspx returns 403 to non-browser
  # User-Agents (we tested ViLA-research/0.1 -> 403, curl/8 -> 403,
  # Mozilla/5.0 Chrome -> 200). The AJAX user control under
  # /SMPT_Publishing_UC/ accepts any UA, but the homepage is where the
  # LinhVuc taxonomy + featured set live, so we need it. The string
  # below is the smallest UA that gets us through the SharePoint UA
  # filter; do not shorten it.
  user_agent: "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36"
