# Default configuration for the timeline builder.
#
# Override individual fields from the CLI (see ``__main__.py``) or
# pass an alternative file via ``--config``. The wiki/TIMELINE.md §6
# documents how each knob shapes the output.

input:
  # Directory of canonical NER per-doc records (symlinks created by
  # the NER pipeline's ``link_canonical`` step). One file per doc:
  # ``<canonical_dir>/<doc_name>.json``.
  canonical_dir: data/samplebanan.toaan.gov.vn/entities/canonical

  # Directory of source markdown files (must be the same one the NER
  # pipeline ran on; the input_text_hash on the cache record must
  # match the file in this directory).
  md_dir: data/samplebanan.toaan.gov.vn/md

output:
  root: data/samplebanan.toaan.gov.vn

cluster:
  # Maximum character distance between a date entity and a
  # subsequent non-date entity for that entity to be attached to
  # the date's event. Larger windows merge more facts onto each
  # event; smaller windows orphan more facts to the ambient bucket.
  # 1500 is calibrated to one paragraph of a Vietnamese ban-án
  # after the preamble.
  window_chars: 1500
