# Workspace-level pyproject.toml.
#
# Keeps the monorepo runnable with `python -m packages.datasites.<site>`
# and `python -m packages.<stage> ...` from the repo root. Each package
# under `packages/` is a plain namespace package (no per-package
# pyproject is required).
#
#   packages/common/          - shared infrastructure (SiteLayout, StageBase)
#   packages/parser/          - stage 2 (site-agnostic)
#   packages/extractor/       - stage 3 (generic + precedent layer)
#   packages/embedder/        - stage 4 (site-agnostic)
#   packages/reducer/         - stage 5 (site-agnostic)
#   packages/visualizer/      - stage 6 (site-agnostic, ontology-driven)
#   packages/runner/          - PipelineRunner base class
#   packages/datasites/<site>/ - site-specific scraper + runner subclass
#                                + configs; the single home for anything
#                                site-specific
#
# Install dev/test deps with:
#     pip install -e ".[dev]"
#
# Install a pipeline's runtime deps with:
#     pip install -r packages/datasites/anle/requirements.txt

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vila"
version = "0.1.0"
description = "Vietnamese Legal Assistant: data, curation, agent, UI"
requires-python = ">=3.11"
readme = "README.md"
license = { file = "LICENSE" }
classifiers = [
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

# The anle pipeline has its own requirements.txt; the workspace-level
# pyproject only pins shared tooling. Any runtime dep belonging to a
# specific package belongs in that package's requirements.txt or
# pyproject.toml, not here.
dependencies = [
  "omegaconf>=2.3",
  # NeMo Curator 2.x is the pipeline runtime: ProcessingStage base class,
  # Pipeline orchestrator, XennaExecutor / RayActorPoolExecutor /
  # RayDataExecutor. `text_cpu` pulls the text-domain readers/writers
  # (ParquetReader, ParquetWriter, JsonlReader, ...) plus the download
  # composite (DocumentDownloadExtractStage). GPU stages (cuML reducer,
  # HuggingFace embedder) pick up the heavy deps via the optional
  # `gpu` extras-group below.
  "nemo-curator[text_cpu]>=0.7",
  # The `pdf_triage` / `pdf_native` pipelines
  # (packages/pipeline/pdf_triage.py) use Curator's *interleaved*
  # namespace -- PDFPartitioningStage, InterleavedBatch and
  # InterleavedParquetWriterStage -- whose package __init__ chain
  # imports cv2 via nemo_curator.stages.interleaved.utils.image_utils.
  #
  # We deliberately do NOT take `nemo-curator[interleaved_cpu]`: that
  # extra also pulls albumentations, open_clip_torch and timm, which
  # only the CLIP-score / blur filter stages need. Our path is
  # text-only (no rasterization, no vision model), so opencv alone is
  # the whole delta. `-headless` because Ray workers have no display
  # and the GUI variant drags in X11 shared libraries.
  "opencv-python-headless>=4.9",
  "docx2txt>=0.9",
  # Reducer stage (packages/reducer) deps. These MUST live in the
  # locked workspace env (not just the per-datasite requirements.txt)
  # so Ray/xenna workers -- which sync from uv.lock -- can import them.
  # The reducer imports `umap` (umap-learn) for UMAP and
  # `sklearn.cluster.HDBSCAN` (scikit-learn >=1.3) for clustering;
  # cuML is an optional GPU accelerant picked up via the `gpu` extra.
  "scikit-learn>=1.3",
  "umap-learn>=0.5.6",
  # hf_export renders the four UMAP scatter PNGs embedded in the
  # dataset card via matplotlib (Agg backend); keep it in the locked
  # env so the publish step doesn't depend on an ad-hoc .venv install.
  "matplotlib>=3.7",
  "pillow>=10",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
]
# GPU / Ray-Data backend extras. The core install is CPU-only and can
# still run the pipeline against a remote Ray cluster via `--executor
# ray_actor_pool --ray-address ray://<head>:10001`.
gpu = [
  "nemo-curator[text_cuda12]>=0.7",
]

[tool.setuptools.packages.find]
# Discover every `packages/*` namespace package without declaring each.
where = ["."]
include = ["packages*"]
namespaces = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
pythonpath = ["."]
addopts = [
  "-ra",
  "--strict-markers",
  "--strict-config",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM", "RUF"]
ignore = [
  "E501",   # line too long - handled by formatter
  "B008",   # function call in default arg - used in CLI/OmegaConf builders
]

[tool.mypy]
python_version = "3.11"
strict = true
exclude = ["tests/fixtures"]
